name: Builder Owner Dashboard V15 Materialize
on:
  push:
    branches: [main]
    paths: ['.github/workflows/builder_ownerdash_v15.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact V14 to V15 patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/build.patch
          git apply --check /tmp/build.patch
          git apply /tmp/build.patch
          git config user.name 'dluciadarmawan-hub'
          git config user.email 'dlucia.darmawan@gmail.com'
          git rm .github/workflows/builder_ownerdash_v15.yml
          git add 00_CONFIG.js 02_SOURCE_READERS.js 08_OWNER_WORKBENCH_V10.js 11_STOCKLOG_EXACT_ROUTING_V15.js
          git commit -m 'Owner Dashboard V15 Stock Log exact task routing'
          git push origin HEAD:main